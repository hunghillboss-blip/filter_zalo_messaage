name: Build and Release Standalone Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Executable (.exe)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "ZaloStockFilter" main.py

      - name: Prepare Package Files
        run: |
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "dist\ZaloStockFilter.exe" -Destination "package\"
          Copy-Item "config.json" -Destination "package\" -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination "package\" -ErrorAction SilentlyContinue
          Compress-Archive -Path "package\*" -DestinationPath "ZaloStockFilter-Windows.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZaloStockFilter-Windows
          path: |
            dist/ZaloStockFilter.exe
            ZaloStockFilter-Windows.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Bộ Lọc Tin Nhắn Zalo PC v1.0.0 (Chạy Ngay Không Cần Python)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ZaloStockFilter.exe
            ZaloStockFilter-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
